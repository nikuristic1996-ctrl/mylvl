<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Temporary OCR runtime check</title>
<body style="font:16px system-ui;background:#101218;color:#eef;padding:24px">
<h1>Temporary OCR runtime check</h1>
<pre id="result" role="status">Loading Tesseract.js…</pre>
<script type="module">
const out = document.querySelector("#result");
let worker;
try {
  const load = new Function("url", "return import(url)");
  const imported = await load("https://cdn.jsdelivr.net/npm/tesseract.js@6.0.1/dist/tesseract.esm.min.js");
  const candidates = [imported, imported?.default, imported?.default?.default];
  const api = candidates.find((candidate) => typeof candidate?.createWorker === "function");
  if (!api) throw new Error("No createWorker function in named or default module exports: " + Object.keys(imported).join(", "));
  out.textContent = "Tesseract module loaded; initializing worker and English + German data…";
  worker = await api.createWorker(["eng", "deu"], 1, {
    workerPath: "https://cdn.jsdelivr.net/npm/tesseract.js@6.0.1/dist/worker.min.js",
    corePath: "https://cdn.jsdelivr.net/npm/tesseract.js-core@v6.0.0",
    langPath: "https://tessdata.projectnaptha.com/4.0.0",
    logger: ({ status, progress }) => { out.textContent = `${status || "Working"} ${Math.round((progress || 0) * 100)}%`; },
  });
  const recognize = async (text) => {
    const canvas = document.createElement("canvas");
    canvas.width = 1600; canvas.height = 280;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "white"; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#111"; ctx.font = "bold 54px Arial"; ctx.fillText(text, 24, 155);
    return (await worker.recognize(canvas)).data.text;
  };
  const english = await recognize("Running Distance 6.3 km Duration 1:03:00");
  const german = await recognize("Laufen Distanz 6,3 km Dauer 1:03:00");
  const englishOk = /Running/i.test(english) && /Distance/i.test(english) && /6[.,]3\s*km/i.test(english) && /Duration/i.test(english);
  const germanOk = /Laufen/i.test(german) && /Distanz/i.test(german) && /6[.,]3\s*km/i.test(german) && /Dauer/i.test(german);
  out.textContent = JSON.stringify({
    result: englishOk && germanOk ? "PASS" : "PARTIAL: OCR recognized text but some expected terms differ",
    export: typeof imported.createWorker === "function" ? "named" : "default interop",
    english, englishOk, german, germanOk,
  }, null, 2);
} catch (error) {
  out.textContent = "FAILED: " + (error?.stack || String(error));
} finally {
  if (worker) await worker.terminate();
}
</script>
</body>
</html>
