name: Phase 6 camera checks

on:
  push:
    branches: [codex/phase-6-camera]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check Edge Function and camera modules
        run: >-
          deno check supabase/functions/award-activity/index.ts
          supabase/functions/_shared/cameraValidation.ts
          supabase/functions/_shared/awardService.ts
          src/poseRecognition.ts src/plankRecognition.ts src/poseRuntime.ts src/ExerciseCamera.tsx
      - name: Apply Phase 6 migration to disposable PostgreSQL and verify it
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/fixtures/phase6-baseline.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261119230337_phase_6_camera_exercise.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/fixtures/phase6-migration-assertions.sql
      - name: Apply Nose Counter migration and verify secure self-report awards
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261123190000_nose_counter_pushup_self_report.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/fixtures/nose-counter-migration-assertions.sql
      - name: Apply Phase 6.5 workout migration and verify secure awards
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261123210000_phase_6_5_camera_workouts.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/fixtures/phase6-5-migration-assertions.sql
      - name: Race two identical camera reservations on disposable PostgreSQL
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/fixtures/phase6-5-concurrent-camera-call.sql > /tmp/camera-one.log &
          first=$!
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/fixtures/phase6-5-concurrent-camera-call.sql > /tmp/camera-two.log &
          second=$!
          wait "$first"
          wait "$second"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/fixtures/phase6-5-concurrent-camera-assertions.sql
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase6-generated-lockfile
          path: package-lock.json
          if-no-files-found: ignore

  integration:
    name: Supabase integration (disposable stack)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.58.5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Start isolated Supabase and run existing integration tests
        env:
          PHASE2_INTEGRATION: '1'
        run: |
          stack="$RUNNER_TEMP/mylvl-integration"
          mkdir -p "$stack/supabase"
          cp supabase/config.toml "$stack/supabase/"
          trap 'supabase stop --workdir "$stack" --no-backup' EXIT

          supabase start --workdir "$stack" -x studio,imgproxy,inbucket,logflare,vector,edge-runtime
          # The historic migration revokes this hosted helper. The app schema enables RLS explicitly.
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 \
            -c 'create function public.rls_auto_enable() returns event_trigger language plpgsql as $fixture$ begin end; $fixture$' \
            -f supabase/schema.sql \
            -f supabase/migrations/20261113011810_phase_2_secure_progression.sql \
            -f supabase/migrations/20261113150000_screenshot_duplicate_guard.sql

          eval "$(supabase status --workdir "$stack" -o env)"
          export SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="$ANON_KEY" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          # Serve the repository handler directly so the local gateway cannot override its CORS headers.
          deno run --allow-env --allow-net supabase/functions/award-activity/index.ts > "$RUNNER_TEMP/mylvl-award.log" 2>&1 &
          edge_pid=$!
          trap 'kill "$edge_pid" 2>/dev/null || true; supabase stop --workdir "$stack" --no-backup' EXIT
          export AWARD_FUNCTION_URL="http://127.0.0.1:8000/"
          if ! curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 \
            -X OPTIONS -H 'Origin: http://localhost:5173' "$AWARD_FUNCTION_URL"; then
            cat "$RUNNER_TEMP/mylvl-award.log"
            exit 1
          fi
          npm run test:integration || { cat "$RUNNER_TEMP/mylvl-award.log"; exit 1; }
