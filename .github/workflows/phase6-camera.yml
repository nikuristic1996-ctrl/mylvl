name: Phase 6 camera checks

on:
  push:
    branches: [codex/phase-6-camera]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check Edge Function and camera modules
        run: >-
          deno check supabase/functions/award-activity/index.ts
          supabase/functions/_shared/cameraValidation.ts
          supabase/functions/_shared/awardService.ts
          src/poseRecognition.ts src/poseRuntime.ts src/ExerciseCamera.tsx
      - name: Apply Phase 6 migration to disposable PostgreSQL and verify it
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/fixtures/phase6-baseline.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261119230337_phase_6_camera_exercise.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/fixtures/phase6-migration-assertions.sql
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase6-generated-lockfile
          path: package-lock.json
          if-no-files-found: ignore
