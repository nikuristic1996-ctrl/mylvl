name: Phase 6 camera checks

on:
  push:
    branches: [codex/phase-6-camera]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check Edge Function and camera modules
        run: >-
          deno check supabase/functions/award-activity/index.ts
          supabase/functions/_shared/cameraValidation.ts
          supabase/functions/_shared/awardService.ts
          src/poseRecognition.ts src/poseRuntime.ts src/ExerciseCamera.tsx
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start disposable local Supabase and apply all migrations
        run: |
          supabase start -x studio,imgproxy,inbucket,storage-api,realtime,analytics,vector,supavisor
          supabase db reset --local
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase6-generated-lockfile
          path: package-lock.json
          if-no-files-found: ignore

